name: Update vcpkg port

on:
  workflow_dispatch:
    inputs:
      port:
        description: "vcpkg port name, for example examplelib"
        required: true
        type: string
      upstream_repository:
        description: "Upstream GitHub repository, for example owner/examplelib"
        required: true
        type: string
      tag:
        description: "Tag to package, for example v1.2.3"
        required: true
        type: string
      dry_run:
        description: "Render and validate the port, print the diff, and skip commit/push"
        default: true
        type: boolean
      cmake_config:
        description: "Generate a simple CMake package config for a single-target port"
        default: false
        type: boolean
      cmake_package_name:
        description: "Optional CMake package name, for example examplelib"
        required: false
        type: string
      cmake_target_name:
        description: "Optional CMake target name, for example examplelib::examplelib"
        required: false
        type: string
      cmake_header_names:
        description: "Optional headers for generated config/test, for example examplelib.h"
        required: false
        type: string
      cmake_library_names:
        description: "Optional libraries for generated config, for example examplelib"
        required: false
        type: string
      consumer_test:
        description: "Build a generated CMake consumer after vcpkg install"
        default: false
        type: boolean
      consumer_test_language:
        description: "Language for the generated CMake consumer"
        default: CXX
        type: choice
        options:
          - CXX
          - C

permissions:
  contents: read

jobs:
  update-vcpkg:
    runs-on: ubuntu-latest
    env:
      PORT: ${{ inputs.port }}
      UPSTREAM_REPOSITORY: ${{ inputs.upstream_repository }}
      VCPKG_FORK_REPOSITORY: ${{ vars.VCPKG_FORK_REPOSITORY }}
      BRANCH_NAME: update/${{ inputs.port }}-${{ inputs.tag }}-${{ github.run_id }}
    steps:
      - name: Check vcpkg fork settings
        env:
          VCPKG_PR_TOKEN: ${{ secrets.VCPKG_PR_TOKEN }}
        run: |
          if [ -z "$VCPKG_FORK_REPOSITORY" ]; then
            echo "::error::VCPKG_FORK_REPOSITORY repository variable is required, for example OWNER/vcpkg"
            exit 1
          fi
          if [ -z "$VCPKG_PR_TOKEN" ]; then
            echo "::error::VCPKG_PR_TOKEN secret is required to push to $VCPKG_FORK_REPOSITORY"
            exit 1
          fi

      - name: Checkout package project
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: project

      - name: Checkout vcpkg fork
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          path: vcpkg
          repository: ${{ env.VCPKG_FORK_REPOSITORY }}
          token: ${{ secrets.VCPKG_PR_TOKEN }}

      - name: Start from microsoft/vcpkg master
        run: |
          git -C vcpkg remote add upstream https://github.com/microsoft/vcpkg.git || true
          git -C vcpkg fetch upstream master
          git -C vcpkg switch -C "$BRANCH_NAME" upstream/master

      - name: Update port
        id: update
        uses: Symmetricity/update-vcpkg-port-action@v1
        with:
          port: ${{ env.PORT }}
          upstream-repository: ${{ env.UPSTREAM_REPOSITORY }}
          tag: ${{ inputs.tag }}
          vcpkg-root: vcpkg
          template-dir: project/.vcpkg-port-template
          cmake-config: ${{ inputs.cmake_config }}
          cmake-package-name: ${{ inputs.cmake_package_name }}
          cmake-target-name: ${{ inputs.cmake_target_name }}
          cmake-header-names: ${{ inputs.cmake_header_names }}
          cmake-library-names: ${{ inputs.cmake_library_names }}
          consumer-test: ${{ inputs.consumer_test }}
          consumer-test-language: ${{ inputs.consumer_test_language }}
          dry-run: ${{ inputs.dry_run }}

      - name: Run package-specific smoke test
        if: ${{ hashFiles('project/.github/vcpkg-consumer-smoke-test.sh') != '' }}
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_TRIPLET: x64-linux
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          bash project/.github/vcpkg-consumer-smoke-test.sh

      - name: Commit and push branch
        if: ${{ steps.update.outputs.changed == 'true' && !inputs.dry_run }}
        env:
          VERSION: ${{ steps.update.outputs.version }}
          PORT_PATH: ${{ steps.update.outputs.port-relative-path }}
          VERSION_PATH: ${{ steps.update.outputs.version-relative-path }}
        run: |
          git -C vcpkg config user.name "github-actions[bot]"
          git -C vcpkg config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C vcpkg add "${PORT_PATH}" "versions/baseline.json" "${VERSION_PATH}"
          git -C vcpkg commit \
            -m "[${PORT}] Update to ${VERSION}" \
            -m "Generated by update-vcpkg-port-action from ${GITHUB_REPOSITORY}."
          git -C vcpkg push origin "HEAD:${BRANCH_NAME}"
          echo "Pushed https://github.com/${VCPKG_FORK_REPOSITORY}/tree/${BRANCH_NAME}"
