name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate workflows
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
        with:
          args: >-
            -color
            .github/workflows/validate.yml
            .github/workflows/codeql.yml
            examples/generic/update-vcpkg-port.yml
            examples/upstream-maintainer/update-vcpkg-port-on-release.yml
            examples/user-maintained-release-watch/update-vcpkg-port.yml
      - name: Audit workflows
        run: pipx run zizmor --pedantic .
      - name: Lint Python
        run: pipx run ruff check scripts tests
      - name: Check Python formatting
        run: pipx run ruff format --check scripts tests
      - name: Compile Python
        run: python3 -m py_compile scripts/update_vcpkg_port.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Prepare self-use fixture
        env:
          FIXTURE_ROOT: ${{ github.workspace }}/selftest
        run: |
          mkdir -p "${FIXTURE_ROOT}/source" "${FIXTURE_ROOT}/template" "${FIXTURE_ROOT}/vcpkg/ports" "${FIXTURE_ROOT}/vcpkg/versions" "${FIXTURE_ROOT}/vcpkg/scripts/buildsystems"
          git -C "${FIXTURE_ROOT}/vcpkg" init

          printf 'fixture source\n' > "${FIXTURE_ROOT}/source/README.txt"
          tar -czf "${FIXTURE_ROOT}/source.tar.gz" -C "${FIXTURE_ROOT}/source" .

          cat > "${FIXTURE_ROOT}/template/portfile.cmake.in" <<'PORTFILE'
          vcpkg_from_github(
              OUT_SOURCE_PATH SOURCE_PATH
              REPO @UPSTREAM_REPOSITORY@
              REF "@TAG@"
              SHA512 @SOURCE_SHA512@
              HEAD_REF @HEAD_REF@
          )
          PORTFILE

          cat > "${FIXTURE_ROOT}/template/vcpkg.json.in" <<'MANIFEST'
          {
            "name": "@PORT@",
            "version": "@VERSION@"
          }
          MANIFEST

          cat > "${FIXTURE_ROOT}/vcpkg/scripts/buildsystems/vcpkg.cmake" <<'TOOLCHAIN'
          get_filename_component(_selftest_vcpkg_root "${CMAKE_CURRENT_LIST_DIR}/../.." ABSOLUTE)
          list(APPEND CMAKE_PREFIX_PATH "${_selftest_vcpkg_root}/installed/${VCPKG_TARGET_TRIPLET}")
          TOOLCHAIN

          cat > "${FIXTURE_ROOT}/vcpkg/vcpkg" <<'VCPKG'
          #!/usr/bin/env bash
          set -euo pipefail

          printf '%s\n' "$*" >> "${SELFTEST_VCPKG_LOG}"
          if [ "${1:-}" = "x-add-version" ]; then
            port="${2:-}"
            first="${port:0:1}"
            mkdir -p "versions/${first}-"
            printf '{"versions":[{"version":"1.2.3","port-version":0,"git-tree":"fake"}]}\n' > "versions/${first}-/${port}.json"
          elif [ "${1:-}" = "install" ]; then
            port_triplet="${2:-}"
            port="${port_triplet%%:*}"
            triplet="${port_triplet#*:}"
            install_root="installed/${triplet}"
            build_root="$(mktemp -d)"

            mkdir -p "${install_root}/include" "${install_root}/lib" "${install_root}/share/${port}"
            cp "ports/${port}/${port}Config.cmake" "${install_root}/share/${port}/${port}Config.cmake"
            cp "ports/${port}/usage" "${install_root}/share/${port}/usage"
            printf '#pragma once\n' > "${install_root}/include/${port}.h"
            printf 'void %s_dummy(void) {}\n' "${port}" > "${build_root}/${port}.c"
            cc -c "${build_root}/${port}.c" -o "${build_root}/${port}.o"
            ar rcs "${install_root}/lib/lib${port}.a" "${build_root}/${port}.o"
            rm -rf "${build_root}"
          fi
          VCPKG
          chmod +x "${FIXTURE_ROOT}/vcpkg/vcpkg"
      - name: Exercise local action
        id: self-test
        uses: ./
        env:
          SELFTEST_VCPKG_LOG: ${{ github.workspace }}/selftest/vcpkg.log
        with:
          port: fixtureport
          upstream-repository: owner/fixtureport
          tag: v1.2.3
          archive-url: file://${{ github.workspace }}/selftest/source.tar.gz
          vcpkg-root: selftest/vcpkg
          template-dir: selftest/template
          cmake-config: true
          cmake-package-name: fixtureport
          cmake-target-name: fixtureport::fixtureport
          cmake-header-names: fixtureport.h
          cmake-library-names: fixtureport
          consumer-test: true
          consumer-test-language: C
      - name: Verify local action outputs
        env:
          PORT_RELATIVE_PATH: ${{ steps.self-test.outputs.port-relative-path }}
          VERSION: ${{ steps.self-test.outputs.version }}
          VERSION_RELATIVE_PATH: ${{ steps.self-test.outputs.version-relative-path }}
        run: |
          test "${VERSION}" = "1.2.3"
          test "${PORT_RELATIVE_PATH}" = "ports/fixtureport"
          test "${VERSION_RELATIVE_PATH}" = "versions/f-/fixtureport.json"
          grep -q "x-add-version fixtureport --overwrite-version" selftest/vcpkg.log
          grep -q "install fixtureport:x64-linux --clean-after-build" selftest/vcpkg.log
          grep -q "add_library(fixtureport::fixtureport UNKNOWN IMPORTED)" selftest/vcpkg/ports/fixtureport/fixtureportConfig.cmake
          grep -q "find_package(fixtureport CONFIG REQUIRED)" selftest/vcpkg/ports/fixtureport/usage
